project:
  type: book
  output-dir: docs

book:
  title: "Statistics by Simulation"
  author: "Junghyun Julian Kim"
  site-url: https://julianjhkim.github.io/statistics-book/
  repo-url: https://github.com/julianjhkim/statistics-book
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  chapters:
    - index.qmd
    - part: "Part 1: Estimating from a Sample"
      chapters:
        - populations-and-samples.qmd
        - standard-error.qmd
    - part: "Part 2: Comparing Means"
      chapters:
        - why-compare-means.qmd
        - t-test.qmd
        - anova.qmd
        - post-hoc.qmd
        - two-way-anova.qmd
        - ancova.qmd
        - one-model.qmd

date-modified: last-modified
date-format: "YYYY-MM-DD"

language:
  title-block-modified: "Last updated"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    fig-align: center
    df-print: paged

bibliography: references.bib

execute:
  freeze: auto
  warning: false

jupyter: book_stats
